# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=omni-resto-backend

# Profiles
spring.profiles.active=dev

# JPA / Database (Dev Profile H2 / Production MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT Configuration Placeholder
jwt.secret=9a4f2c8d7e1b3a5f6c8d0e2f4a6b8c0d1e3f5a7b9c1d3e5f7a9b0c2d4e6f8a0b
jwt.expiration-ms=86400000

# Logging
logging.level.com.omniresto.backend=DEBUG
logging.level.org.springframework.security=INFO
