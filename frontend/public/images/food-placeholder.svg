<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#bgGradient)" rx="16" />

  <!-- Subtle Ambient Plate Rim -->
  <ellipse cx="200" cy="180" rx="110" ry="32" fill="#334155" opacity="0.4" />
  <ellipse cx="200" cy="176" rx="98" ry="26" fill="#1e293b" stroke="#475569" stroke-width="2" opacity="0.6" />

  <!-- Cloche / Serving Dome -->
  <path d="M 125 170 C 125 110, 275 110, 275 170 Z" fill="url(#amberGlow)" opacity="0.9" filter="url(#glow)" />
  <rect x="115" y="170" width="170" height="8" rx="4" fill="#f59e0b" />
  
  <!-- Handle Knob -->
  <circle cx="200" cy="108" r="10" fill="#fde68a" stroke="#d97706" stroke-width="2" />
  <path d="M 196 118 L 204 118" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

  <!-- Aroma / Steam Ribbons -->
  <path d="M 175 92 Q 170 80, 175 70 T 170 52" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 200 86 Q 205 74, 200 64 T 205 48" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 225 92 Q 220 80, 225 70 T 220 52" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

  <!-- Brand / Placeholder Subtext -->
  <text x="200" y="228" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
    OMNI RESTO
  </text>
  <text x="200" y="248" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    Hình ảnh món đang được cập nhật
  </text>
</svg>
